<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 | TiffinTrack</title>
  <style>
    :root { --bg1: #eff6ff; --bg2: #dbeafe; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --accent: #2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Poppins, Arial, sans-serif; background: radial-gradient(circle at top right, var(--bg2), var(--bg1)); color: var(--text); }
    .card { width: min(90vw, 560px); background: var(--card); border-radius: 20px; padding: 2rem; text-align: center; box-shadow: 0 12px 40px rgba(17, 24, 39, 0.15); }
    h1 { margin: 0; font-size: 3rem; color: var(--accent); }
    p { color: var(--muted); margin: 0.8rem 0 1.5rem; }
    a { display: inline-block; text-decoration: none; background: var(--accent); color: #fff; padding: 0.75rem 1.1rem; border-radius: 10px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <h1>403</h1>
    <h2>Access Denied</h2>
    <p>You do not have permission to access this page.</p>
    <a href="/">Back To Home</a>
  </main>
</body>
</html>
