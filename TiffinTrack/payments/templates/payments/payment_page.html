{% extends "users/base.html" %}
{% load static %}
{% block content %}



    <!-- page head section starts -->
    <section class="page-head-section">
        <div class="container page-heading">
            <h2 class="h3 mb-3 text-white text-center">Confirm Order</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb flex-lg-nowrap justify-content-center justify-content-lg-star">
                    <li class="breadcrumb-item">
                        <a href="index.html"><i class="ri-home-line"></i>Home</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        Confirm Order
                    </li>
                </ol>
            </nav>
        </div>
    </section>
    <!-- page head section end -->

    <!--  account section starts -->
    <section class="account-section section-b-space pt-0">
        <div class="container">
            <div class="layout-sec">
                <div class="row g-lg-4 g-4 d-flex justify-content-center">
                    <div class="col-lg-8">
                        <div class="payment-section">
                            <div class="title mb-0">
                                <div class="loader-line"></div>
                                <h3>Choose Payment Method</h3>
                                <h6>Razorpay is currently the only supported payment option.</h6>
                            </div>
                            <div class="mt-4">
                                <ul class="card-list">
                                    <li>
                                        <div class="form-check form-check-reverse border rounded-3 p-3">
                                            <label class="form-check-label d-flex align-items-center gap-2" for="razorpay">
                                                <img class="img-fluid img"
                                                    src="{% static 'frontend/assets/images/icons/svg/razorpay.svg' %}"
                                                    style="width: 18px; height: auto;" alt="razorpay">
                                                <span class="card-name dark-text">Razorpay</span>
                                                <span class="badge bg-success ms-2">Available</span>
                                            </label>
                                            <input id="razorpay" class="form-check-input" type="radio"
                                                name="payment_method" value="razorpay" checked>
                                        </div>
                                    </li>
                                    <li>
                                        <div id="cod-option" class="form-check form-check-reverse border rounded-3 p-3" style="cursor:pointer;">
                                            <label class="form-check-label d-flex align-items-center gap-2" for="cod">
                                                <img class="img-fluid img"
                                                    src="{% static 'frontend/assets/images/icons/svg/cash.svg' %}"
                                                    alt="cash on delivery">
                                                <span class="card-name dark-text">Cash On Delivery</span>
                                                <span class="badge bg-secondary ms-2">Coming Soon</span>
                                            </label>
                                            <input id="cod" class="form-check-input" type="radio"
                                                name="payment_method" value="cod">
                                        </div>
                                    </li>
                                </ul>
                                <p id="cod-message" class="mt-2 mb-0 text-danger d-none">Cash on Delivery is not supported for now.</p>
                            </div>
                            <div class="d-flex justify-content-end mt-3">
                                <button id="rzp-button" class="btn theme-btn">Pay with Razorpay</button>
                                <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- account section end -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const razorpayRadio = document.getElementById("razorpay");
    const codRadio = document.getElementById("cod");
    const codOption = document.getElementById("cod-option");
    const codMessage = document.getElementById("cod-message");

    const showCodNotSupported = function () {
        codMessage.classList.remove("d-none");
        codRadio.checked = false;
        razorpayRadio.checked = true;
    };

    codOption.addEventListener("click", showCodNotSupported);
    codRadio.addEventListener("change", showCodNotSupported);
});
</script>




<script>
    var options = {
        "key": "{{ razorpay_key_id }}",
        "amount": "{{ amount }}",  // in paise
        "currency": "INR",
        "name": "TiffinTrack",
        "description": "Monthly Meal Subscription",
        "order_id": "{{ order_id }}",
        "handler": function (response) {
            // On successful payment
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = "{{ callback_url }}";

            const csrfToken = "{{ csrf_token }}";

            const addField = (name, value) => {
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = name;
                input.value = value;
                form.appendChild(input);
            };

            addField("csrfmiddlewaretoken", csrfToken);
            addField("razorpay_payment_id", response.razorpay_payment_id);
            addField("razorpay_order_id", response.razorpay_order_id);
            addField("razorpay_signature", response.razorpay_signature);

            document.body.appendChild(form);
            form.submit();
        },
        "modal": {
            "ondismiss": function () {
                // Handle payment cancellation here
                window.location.href = "{% url 'payment_cancelled' %}";
            }
        },
        "theme": {
            "color": "#f2a93e"
        }
    };

    var rzp = new Razorpay(options);
    document.getElementById('rzp-button').onclick = function (e) {
        rzp.open();
        e.preventDefault();
    };
</script>



{%endblock%}
